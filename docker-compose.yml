# 可选本地依赖：Postgres + MinIO（S3 兼容）。
# Neon + R2 开发时通常不需要启动本文件；若要完全离线跑 server 的 DB 集成测试，
# 或本地试验 S3 API，可执行：docker compose up -d
#
# 连接串示例（与 .env.example 对齐时请改密码）：
#   DATABASE_URL=postgres://dialogue:dialogue_dev_only@localhost:5432/dialogue_search
# MinIO 控制台 http://localhost:9001 （默认账号见下方环境变量）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dialogue
      POSTGRES_PASSWORD: dialogue_dev_only
      POSTGRES_DB: dialogue_search
    volumes:
      - dialogue_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialogue -d dialogue_search"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    command: server /data --console-address ":9001"
    volumes:
      - dialogue_minio_data:/data

volumes:
  dialogue_pg_data:
  dialogue_minio_data:
